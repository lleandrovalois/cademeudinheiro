services:
  cademeudinheiro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cademeudinheiro_app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3000"
    volumes:
      - cademeudinheiro_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/cademeudinheiro.db
      - JWT_SECRET=${JWT_SECRET:-cademeudinheiro_jwt_secret_key_prod_2026}
      - SMTP_HOST=${SMTP_HOST:-smtp.hostinger.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - APP_URL=${APP_URL:-https://financeiro.klynner.com.br}
      - CRON_SECRET=${CRON_SECRET:-cademeudinheiro_cron_secret}

volumes:
  cademeudinheiro_data:
    driver: local
